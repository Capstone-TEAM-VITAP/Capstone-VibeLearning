[supervisord]
nodaemon=true
user=root
logfile=/var/log/supervisor/supervisord.log
pidfile=/var/run/supervisord.pid
loglevel=info

[program:ai-service]
command=/opt/venv/bin/uvicorn src.main:app --app-dir /app/apps/ai-service --host 127.0.0.1 --port 8000
directory=/app/apps/ai-service
autostart=true
autorestart=false
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
stopsignal=TERM
stopwaitsecs=10
environment=PYTHONUNBUFFERED="1",CODEAI_ANALYSIS_ROOT="/tmp/codeai-repos"

[program:backend]
command=node /app/apps/backend/index.js
directory=/app/apps/backend
autostart=true
autorestart=false
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
stopsignal=TERM
stopwaitsecs=10
environment=NODE_ENV="production",AI_SERVICE_URL="http://127.0.0.1:8000",GIT_CACHE_DIR="/tmp/codeai-repos",HOST="0.0.0.0"

[eventlistener:supervisor_watchdog]
command=/opt/venv/bin/python3 -u /app/infra/scripts/supervisor_watchdog.py
events=PROCESS_STATE_EXITED,PROCESS_STATE_FATAL
